org.gradle.jvmargs=-Xmx1536m -Xms512m -Xss1m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Enable the Gradle daemon to improve build performance and reuse JVM
org.gradle.daemon=true
# Allow more workers if machine can handle it (adjust if you hit memory limits)
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
